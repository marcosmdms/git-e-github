pwd

# O que tem nesta pasta?
ls
# Windows: dir

# Entrar em uma pasta
cd meu-projeto

# Voltar uma pasta
cd ..

# Criar pasta nova
mkdir meu-projeto

# Criar arquivo vazio
touch README.md
# Windows: echo. > README.md

# Limpar a tela
clear
# Windows: cls

# Caminho absoluto vs relativo
# Absoluto: começa da raiz, sempre igual
/Users/seu-nome/projetos/aula

# Relativo: a partir de onde você está
./meu-projeto
../outra-pasta`,tip:"Tecla TAB completa nome de pasta e arquivo automaticamente. Seta para cima ↑ repete o último comando. Ctrl + C cancela qualquer comando travado. São 3 atalhos que economizam horas.",quiz:[{q:"O que é o terminal, na prática?",options:["Um navegador de internet","Uma forma de falar com o computador por comandos de texto, mais rápida que clicar","Só serve pra hackear"],correct:1,explain:"Isso! Você digita, ele responde. Bem mais direto que menus e cliques."},{q:"Qual atalho completa o nome de arquivos/pastas?",options:["Ctrl + C","Tecla TAB","Alt + F4"],correct:1,explain:"TAB é mágico: digita as primeiras letras e aperta TAB que ele completa sozinho."}]},{id:2,emoji:"\uD83D\uDD70️",title:"O que é Git vs GitHub?",time:"5 min",bullets:["Git é a sua máquina do tempo: ele grava cada mudança do código no seu computador, e você pode voltar quando quiser.","GitHub é o Drive social do Git: guarda seu código na nuvem pra você acessar de qualquer lugar e mostrar pro mundo.","Saca? Git funciona 100% offline. GitHub só entra quando você quer compartilhar, fazer backup ou trabalhar com outras pessoas."],code:`# Git = local, seu histórico
git --version

# GitHub = remoto, na nuvem
# Você acessa pelo navegador: github.com`,tip:"Pensa assim: você escreve um TCC. Git salva todas as versões no seu PC. GitHub é onde você manda pra orientadora ver e comentar. Simples assim.",quiz:[{q:"Qual a principal diferença entre Git e GitHub?",options:["São a mesma coisa","Git é local (máquina do tempo), GitHub é na nuvem (Drive social)","GitHub funciona sem Git"],correct:1,explain:"Exato! Git guarda histórico no seu PC. GitHub guarda esse histórico na nuvem pra compartilhar."},{q:"Preciso de internet pra usar Git?",options:["Sim, sempre","Não, só precisa pra enviar pro GitHub (push/pull)","Só no Linux"],correct:1,explain:"Bora! Você commita offline à vontade. Internet só entra pra sincronizar com a nuvem."}]},{id:3,emoji:"\uD83D\uDCBB",title:"Instalação e Configuração",time:"8 min",bullets:["Primeiro: instala o Git. No site git-scm.com tem pra Win/Mac/Linux. É rapidinho.","Depois você se apresenta: git config guarda seu nome e email em cada commit, como uma assinatura.","Nesta aula usamos config local: vale só para ESTE repositório. É mais seguro pra iniciantes e evita conflitos se você usa emails diferentes."],code:`# Se apresente pro Git neste repositório
git config user.name "Seu Nome"
git config user.email "seu@email.com"

# Ver o que foi salvo
git config --list

# Dica: deixa colorido também só aqui
git config color.ui auto`,tip:"Config local = segura e específica deste projeto. O Git salva no arquivo .git/config da pasta atual. Use o mesmo email do seu GitHub para os commits aparecerem na sua conta. Nesta aula usamos sempre config local pra evitar bagunça e conflitos de email. A opção global existe para todos os projetos, mas fica pra depois.",quiz:[{q:"Pra que serve o git config?",options:["Apagar repositório","Dizer ao Git quem é você (nome e email)","Criar branch"],correct:1,explain:"Isso! Cada commit carrega seu nome/email. É sua assinatura digital no código."},{q:"Configurando com git config user.name desse jeito (local), onde ela vale?",options:["Só funciona online","Apenas neste repositório (config local)","Apaga tudo"],correct:1,explain:"Perfeito! Sem flag global é config local, vale só na pasta atual. Mais seguro pra começar e evita conflito de emails."}]},{id:4,emoji:"\uD83C\uDF31",title:"Seu Primeiro Repositório",time:"15 min",bullets:["git init cria a pasta mágica .git - é ela que transforma uma pasta comum em máquina do tempo.",'git add . pega seus arquivos e leva pra "área de espera" (staging). É tipo separar a roupa pra foto.','git commit -m "mensagem" tira a foto! Agora está salvo pra sempre no histórico. Bora?'],code:`# 1. Inicia a máquina do tempo
git init

# 2. Vê o que mudou
git status

# 3. Leva pra área de espera
git add .

# 4. Tira a foto com mensagem
git commit -m "primeiro commit: estrutura inicial"

# 5. Vê as fotos que já tirei
git log --oneline`,tip:'Mensagem de commit boa: começa com verbo no presente. "adiciona hero", "corrige bug do menu". Futuro você vai agradecer.',quiz:[{q:"O que o git add . faz?",options:["Deleta arquivos","Leva todos os arquivos pra área de staging (espera pro commit)","Envia pro GitHub"],correct:1,explain:"Isso! Add = preparar. Commit = salvar. Push = enviar pra nuvem. Cada um no seu quadrado."},{q:"Pra que serve o .git?",options:["É lixo, pode apagar","É o banco de dados onde o Git guarda todo histórico","É o README"],correct:1,explain:"Exato! Apagar .git = apagar toda a máquina do tempo. Nunca apague na mão!"}]},{id:5,emoji:"⏪",title:"Voltando no Tempo",time:"10 min",bullets:["Fez cagada? git log mostra todas as fotos (commits) com data, autor e mensagem. Seu histórico completo.","git diff mostra o que mudou entre duas versões. Linha a linha, verde adicionou, vermelho removeu.","git restore volta um arquivo pro último commit. É o famoso Ctrl+Z super poderoso. Sem pânico!"],code:`# Ver histórico bonitão
git log --oneline --graph --all

# O que mudei e ainda não commitei?
git diff

# Voltar um arquivo ao último commit
git restore index.html

# Voltar e já tirar da staging area
git restore --staged index.html`,tip:"git restore não apaga commit, só desfaz mudanças ainda não salvas. Quer desfazer um commit já feito? A gente vê git revert na próxima fase, fica tranquilo.",quiz:[{q:"git log serve pra...",options:["Apagar histórico","Ver todos os commits já feitos","Criar branch"],correct:1,explain:"Perfeito! Log = diário de bordo. Você vê quem fez o que e quando."},{q:"Mudei um arquivo e me arrependi antes de commitar. O que faço?",options:["git restore nome-do-arquivo","Formatar o PC","git push --force"],correct:0,explain:"Isso! Restore traz o arquivo de volta pro estado do último commit. Sem drama."}]},{id:6,emoji:"\uD83C\uDF0C",title:"Universos Paralelos (Branches)",time:"12 min",bullets:["Branch = universo paralelo. A main é a linha do tempo principal, a oficial.","Você cria uma branch nova pra testar uma ideia maluca sem quebrar a main. Se der ruim, apaga.","Deu bom? git merge traz tudo de volta pra main. É juntar os universos."],code:`# Ver onde estou
git branch

# Criar universo novo e já entrar nele
git switch -c nova-ideia

# Ou o clássico
git branch nova-ideia
git switch nova-ideia

# Voltar pra main e juntar tudo
git switch main
git merge nova-ideia`,tip:"Profissional nunca codifica direto na main. Sempre: cria branch -> commita -> abre PR -> mergeia. Isso evita quebrar o site de todo mundo.",quiz:[{q:"Pra que serve branch?",options:["Deixar o Git mais lento","Criar uma linha do tempo paralela pra testar sem quebrar a main","Deletar código"],correct:1,explain:"Exatamente! Branch = laboratório. Testa à vontade sem medo."},{q:"O que git merge faz?",options:["Cria conflito sempre","Junta o código de uma branch em outra","Apaga commits"],correct:1,explain:"Isso! Merge = trazer as novidades da branch filha pra mãe."}]},{id:7,emoji:"☁️",title:"Levando pra Nuvem",time:"10 min",bullets:["remote é só um apelido pro endereço do seu repo no GitHub. Por convenção chamamos de origin.","git push = empurra seus commits locais pra nuvem. git pull = puxa o que está na nuvem pra sua máquina.",'git clone = baixa um repo que já existe. É o "primeiro contato" quando você vai contribuir num projeto.'],code:`# Linkar seu repo local com o GitHub (só 1 vez)
git remote add origin https://github.com/seu-user/sua-aula.git

# Ver se linkou
git remote -v

# Enviar (na primeira vez use -u)
git push -u origin main

# Depois, só
git push

# -> abre PR no GitHub -> code review -> merge!`,tip:"Commitar node_modules é pecado capital. São milhares de arquivos pesados que qualquer um baixa com npm install. Sempre no .gitignore!",quiz:[{q:".gitignore serve pra...",options:["Deixar o repo mais bonito","Dizer quais arquivos/pastas o Git deve ignorar","Criar licença"],correct:1,explain:"Isso! Evita enviar lixo e segredos pro GitHub."},{q:"Qual fluxo profissional simplificado?",options:["Codar direto na main e dar push --force","branch -> commits pequenos -> push -> PR -> merge","Nunca commitar"],correct:1,explain:"Perfeito! Esse fluxo te salva de 90% dos conflitos e tretas em equipe."}]},{id:10,emoji:"\uD83D\uDDC2️",title:"Organizando seu Projeto no GitHub",subtitle:"Issues, Labels, Milestones, Projects e Releases — gestão sem sair do GitHub",time:"15 min",bullets:['Issues — O QUE É: post-it digital ou ticket de tarefa. É onde se registra tudo que precisa ser feito, bug, ideia, melhoria. PRA QUE SERVE: organizar trabalho, não esquecer nada, discutir soluções, documentar decisões. Substitui anotação no caderno. Analogia: Trello simplificado dentro do GitHub. Cada issue = um card de tarefa. COMO USAR: título claro como "Bug: botão não funciona no mobile", descrição com checklist, print e passos para reproduzir, linkar com commit usando "Fixes #12" ou "Closes #12" na mensagem.',"Labels (Etiquetas) — O QUE É: adesivos coloridos para categorizar issues e PRs. PRA QUE SERVE: filtrar e priorizar rápido, saber o que é bug, melhoria, documentação, urgente. Exemplos práticos: bug (vermelho), enhancement (azul), documentation (roxo), good first issue (verde para iniciantes), help wanted, priority: high. COMO USAR: criar labels customizadas em Issues → Labels, aplicar em cada issue, filtrar por label no board.",'Milestones (Marcos) — O QUE É: uma caixinha que agrupa várias issues com objetivo ou data. Como pasta de metas. PRA QUE SERVE: planejar versões. Ex: Milestone v1.0 agrupa todas as issues que precisam estar prontas para lançar versão 1.0. Mostra barra de progresso % automaticamente. Analogia: é como capítulo de um livro. Cada issue é uma página do capítulo. COMO USAR: criar milestone "v1.0 - Lançamento" com data, adicionar issues nele, acompanhar progresso na aba Milestones.',"Projects (Kanban) — O QUE É: quadro visual com colunas To Do, In Progress, Done. Igual Trello/Notion, mas dentro do GitHub. PRA QUE SERVE: ver fluxo de trabalho do time, arrastar cards, ter visão do que está travado, quem está fazendo o quê. COMO USAR: criar Project board (Beta), adicionar issues automaticamente, mover cards arrastando. Pode conectar automações: quando PR é mergeado, issue vai para Done.",'Releases — O QUE É: um pacote oficial do projeto em um ponto do tempo. Um "print" da versão estável. PRA QUE SERVE: entregar para usuários, criar histórico de versões, anexar arquivos (zip, binário), gerar changelog. COMO USAR: criar tag local com git tag v1.0, enviar com git push origin v1.0, depois criar Release no GitHub com notas do que mudou, linkando issues fechadas.'],code:`# Issues - linkar commit com issue
# Na mensagem de commit, use:
git commit -m "corrige bug do menu mobile Fixes #12"
# ou
git commit -m "adiciona login Closes #13"
# GitHub fecha a issue automaticamente no merge

# Labels - filtrar por etiqueta no GitHub
# Issues → Label: bug, enhancement, documentation
# Criar label custom: Issues → Labels → New label

# Milestones - agrupar issues por versão
# Issues → Milestones → New milestone
# Título: v1.0 - Lançamento | Data: 2025-12-01
# Depois adicione issues no milestone

# Projects - Kanban no GitHub
# Projects → New project → Board
# Colunas: To Do, In Progress, Done
# Adicionar issues existentes e arrastar

# Releases - marcar versão oficial

git push origin v1.0
# Depois: GitHub → Releases → Draft new release
# Escolha tag v1.0, escreva changelog, publique

# Ver tags locais
git tag
git show v1.0`,tip:'Issue bem escrita tem contexto, print, passos para reproduzir e critério de pronto. Use template: "Contexto, Problema, Como reproduzir, O que deveria acontecer". Labels como "good first issue" ajudam iniciantes a contribuir. Milestone v1.0 deve ter data real — cria senso de prazo. Releases com changelog bem feito viram portfólio.',quiz:[{q:"Quando usar Issue vs Milestone?",options:["Issue para tarefa pontual, Milestone para agrupar várias issues de uma versão/meta","São a mesma coisa","Milestone é só para bug"],correct:0,explain:"Perfeito! Issue = uma tarefa. Milestone = caixinha que agrupa várias issues para entregar uma versão. Capítulo vs páginas."},{q:'Para que serve "Fixes #12" no commit?',options:["Só decoração","Linka o commit com a issue #12 e fecha automaticamente quando mergear","Apaga o repositório"],correct:1,explain:"Isso! É mágico: GitHub entende que aquele commit resolve a issue #12 e fecha sozinho no merge. Organização automática."}]},{id:11,emoji:"\uD83D\uDEE0️",title:"Fluxo de Trabalho Real - Review, Conflitos, Stash e Tags",subtitle:"O dia a dia de um time profissional: revisão, conflitos, gaveta temporária e segurança",time:"15 min",bullets:["Revisão de Pull Request (Code Review) — O QUE É: outra pessoa ler o código antes de entrar no projeto principal. Como revisão de redação. PRA QUE SERVE: pegar bugs, aprender, manter qualidade, compartilhar conhecimento. COMO FUNCIONA: comentar em linha específica, sugerir mudança (suggestion), Approve / Request Changes, conversar no PR, resolver threads. Regra: ninguém mergeia próprio PR sem aprovação.","Conflitos de Merge — O QUE É: duas pessoas mexeram na mesma linha do mesmo arquivo. Git não sabe qual manter. PRA QUE SERVE entender: é normal, acontece todo dia em time. Não é erro de ninguém, é sinal de colaboração. COMO RESOLVER: Git marca com <<<<<<< HEAD (seu código), ======= (separador), >>>>>>> branch (código vindo). Editar manualmente, escolher ou mesclar, remover marcadores, depois git add + git commit. Visual no simulador abaixo.","Git Stash — O QUE É: uma gaveta temporária. Guarda mudanças sem precisar commitar. PRA QUE SERVE: precisa trocar de branch rápido mas está no meio de algo inacabado? Dá stash, troca, depois volta e aplica. Analogia: minimizar janela no computador. COMANDOS: git stash (guarda), git stash list (ver gavetas), git stash pop (aplica e remove da gaveta), git stash apply (aplica e mantém).","Tags e Revert (Segurança) — git tag v1.0: O QUE É: etiqueta em um commit específico, como marcar página com post-it. PRA QUE SERVE: marcar versões estáveis (v1.0, v1.1). git revert: O QUE É: criar novo commit que desfaz um commit antigo, sem apagar histórico. PRA QUE SERVE: desfazer sem quebrar histórico do time (seguro). Diferença crucial: git reset --hard (perigoso, apaga histórico, reescreve) vs git revert (seguro, cria novo commit que desfaz). Nunca usar reset --hard em branch compartilhada.",'Autenticação Moderna (Essencial) — O QUE É: GitHub não aceita mais senha no terminal desde 2021. PRA QUE SERVE saber: se não configurar, push falha com "Authentication failed". COMO RESOLVER: Opção 1 (mais fácil para iniciante): GitHub CLI com gh auth login — faz login no navegador e configura tudo. Opção 2: Personal Access Token (PAT) — criar em Settings → Developer settings → Tokens, usar token como senha no HTTPS. HTTPS vs SSH breve: HTTPS usa token, pede login; SSH usa chave, não pede senha após configurar.'],code:`# Code Review - fluxo no GitHub
# 1. Abrir PR → aba Files changed → comentar linha
# 2. Sugerir mudança, Approve ou Request Changes
# 3. Autor ajusta, faz push, review novamente

# Conflito - quando acontece
git switch main
git merge nova-ideia
# CONFLICT in app.js → editar arquivo:
# <<<<<<< HEAD
# seu código
# =======
# código da branch
# >>>>>>> nova-ideia
# Resolver → git add app.js → git commit

# Stash - gaveta temporária
git stash
# "guardei tudo aqui, estou limpo"
git switch outra-branch
# ...faz algo...
git switch main
git stash pop
# volta o que estava fazendo

git stash list
# stash@{0}: WIP on main

# Tags - marcar versão
git tag v1.0
git tag -a v1.0 -m "primeira versão estável"
git push origin v1.0
git push origin --tags

# Revert vs Reset (segurança!)
git revert abc1234
# seguro: cria novo commit que desfaz abc1234

git reset --hard abc1234
# PERIGOSO: apaga commits depois de abc1234
# nunca usar em main compartilhada!

# Autenticação Moderna
# Opção 1: GitHub CLI (recomendado)
gh auth login
# siga passos no navegador

# Opção 2: PAT (Personal Access Token)
# GitHub → Settings → Developer settings → Tokens
# gere token, copie, use como senha no push

# HTTPS: https://github.com/user/repo.git (usa token)
# SSH: git@github.com:user/repo.git (usa chave ssh)`,tip:"Conflito não é erro — é sinal de que duas pessoas colaboraram. Resolva com calma: leia as duas versões, converse com o colega, mescle o melhor dos dois. Sobre reset --hard: só use local e sozinho, nunca em branch compartilhada. Revert é o seguro para desfazer em time. Para autenticação, gh auth login resolve 90% dos casos sem dor de cabeça.",quiz:[{q:"Deu conflito no merge. O que significam <<<<<<<, =======, >>>>>>> ?",options:["Erro do Git, apagar tudo e começar de novo","Marcadores: HEAD = seu código atual, ======= separa, >>>>>>> = código da outra branch. Editar, escolher, remover marcadores, add + commit","São comentários normais"],correct:1,explain:"Exato! São marcações para você decidir. Edita o arquivo, deixa só o que faz sentido, apaga os marcadores, depois add + commit."},{q:"Está no meio de algo, precisa trocar de branch urgente sem commitar. O que fazer?",options:["git stash para guardar na gaveta temporária, trocar de branch, depois git stash pop para voltar","Apagar tudo","git push --force"],correct:0,explain:"Isso! Stash = gaveta temporária. Guarda sem commitar, troca de branch tranquilo, depois pop para recuperar. Como minimizar janela."}]}];function ev({code:e,onCopy:t}){let[n,r]=J.useState(!1);return c("div",{className:"relative rounded-xl overflow-hidden border border-[#30363d] bg-[#0d1117] group",children:[c("div",{className:"flex items-center justify-between px-4 py-2 bg-[#161b22] border-b border-[#30363d]",children:[c("div",{className:"flex items-center gap-2",children:[c("div",{className:"flex gap-1.5",children:[s("div",{className:"w-3 h-3 rounded-full bg-[#ff5f56]"}),s("div",{className:"w-3 h-3 rounded-full bg-[#ffbd2e]"}),s("div",{className:"w-3 h-3 rounded-full bg-[#27c93f]"})]}),s("span",{className:"text-xs text-[#8b949e] font-mono ml-2",children:"terminal — zsh"})]}),c("button",{onClick:()=>{t(e),r(!0),setTimeout(()=>r(!1),2000)},className:"flex items-center gap-1.5 px-2.5 py-1 roun
